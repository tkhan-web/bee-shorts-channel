<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bee Pollination Short</title>
    <style>
      :root {
        --bg1: #0a1d1a;
        --bg2: #183d34;
        --green: #7ad77b;
        --yellow: #f9d765;
        --gold: #ffca3a;
        --orange: #ff8a3d;
        --cream: #f4f1d7;
        --text: #f6f5ef;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, var(--bg1), var(--bg2));
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, #0d221d 0%, #1b453b 100%);
        border: 0;
      }

      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: sceneFade 20s infinite;
      }

      .scene:nth-child(1) { animation-delay: 0s; }
      .scene:nth-child(2) { animation-delay: 5s; }
      .scene:nth-child(3) { animation-delay: 9s; }
      .scene:nth-child(4) { animation-delay: 13s; }
      .scene:nth-child(5) { animation-delay: 17s; }

      @keyframes sceneFade {
        0%, 18% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }

      .sun {
        position: absolute;
        right: 120px;
        top: 90px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffe99a 0%, #ffd75a 40%, rgba(255, 215, 90, 0.2) 100%);
        box-shadow: 0 0 90px rgba(255, 215, 90, 0.7);
      }

      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 420px;
        background: linear-gradient(180deg, #4a8d4c, #2b5e29 68%, #173c21 100%);
      }

      .grass {
        position: absolute;
        inset: auto 0 0 0;
        height: 180px;
        background: repeating-linear-gradient(
          90deg,
          rgba(112, 185, 86, 0.9) 0,
          rgba(112, 185, 86, 0.9) 18px,
          rgba(89, 168, 76, 0.9) 18px,
          rgba(89, 168, 76, 0.9) 36px
        );
        opacity: 0.8;
      }

      .flower {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        bottom: 210px;
        left: 50%;
        transform: translateX(-50%);
        animation: sway 2.2s ease-in-out infinite alternate;
      }

      .flower .center {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 46px;
        height: 46px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, #f8d85d 0%, #d69a1d 55%, #8d5b00 100%);
        border-radius: 50%;
        z-index: 4;
      }

      .petal {
        position: absolute;
        width: 42px;
        height: 86px;
        left: 50%;
        top: 50%;
        margin-left: -21px;
        margin-top: -43px;
        background: linear-gradient(180deg, #fff1a8, #ffb86a 60%, #ff8f5c 100%);
        border-radius: 46% 54% 55% 45% / 58% 42% 58% 42%;
        transform-origin: 50% 100%;
        box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
      }

      .flower .petal:nth-child(1) { transform: rotate(0deg) translateY(-78px); }
      .flower .petal:nth-child(2) { transform: rotate(45deg) translateY(-78px); }
      .flower .petal:nth-child(3) { transform: rotate(90deg) translateY(-78px); }
      .flower .petal:nth-child(4) { transform: rotate(135deg) translateY(-78px); }
      .flower .petal:nth-child(5) { transform: rotate(180deg) translateY(-78px); }
      .flower .petal:nth-child(6) { transform: rotate(225deg) translateY(-78px); }
      .flower .petal:nth-child(7) { transform: rotate(270deg) translateY(-78px); }
      .flower .petal:nth-child(8) { transform: rotate(315deg) translateY(-78px); }

      .stem {
        position: absolute;
        width: 8px;
        height: 200px;
        background: linear-gradient(180deg, #3bbd4e, #1e7c2a);
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        border-radius: 10px;
      }

      .leaf {
        position: absolute;
        width: 96px;
        height: 54px;
        background: linear-gradient(135deg, #45d25b, #2ea047);
        border-radius: 70% 0 70% 0;
        bottom: 110px;
        left: 50%;
      }

      .leaf.left { transform: translateX(-118px) rotate(-28deg); }
      .leaf.right { transform: translateX(22px) rotate(28deg) scaleX(-1); }

      .bee {
        position: absolute;
        width: 90px;
        height: 55px;
        left: 25%;
        top: 42%;
        animation: beeFly 5s ease-in-out infinite;
      }

      .bee-body {
        position: absolute;
        left: 12px;
        top: 13px;
        width: 56px;
        height: 26px;
        background: linear-gradient(180deg, #f8d655, #f0b91d 60%, #d48a10 100%);
        border-radius: 40% 40% 50% 50%;
        border: 3px solid #2a2a2a;
      }

      .bee-body::before,
      .bee-body::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 18px;
        background: #1c1c1c;
        border-radius: 50%;
        top: 3px;
      }

      .bee-body::before { left: 8px; }
      .bee-body::after { right: 8px; }

      .bee-wing {
        position: absolute;
        width: 24px;
        height: 18px;
        background: rgba(255,255,255,0.7);
        border-radius: 60% 40% 50% 50%;
        top: 0;
        border: 2px solid rgba(80,80,80,0.4);
      }

      .bee-wing.left { left: 0; transform: rotate(-20deg); }
      .bee-wing.right { right: 2px; transform: rotate(20deg); }

      .bee .stinger {
        position: absolute;
        width: 7px;
        height: 22px;
        background: #1a1a1a;
        right: 0;
        top: 18px;
        border-radius: 10px;
      }

      .bee .antenna {
        position: absolute;
        width: 3px;
        height: 18px;
        background: #1a1a1a;
        top: -8px;
        left: 22px;
        transform: rotate(-25deg);
      }

      .bee .antenna.right {
        left: 48px;
        transform: rotate(25deg);
      }

      .bee .antenna::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #1a1a1a;
        top: -6px;
      }

      .pollen {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffdb59 0%, #ffb84d 50%, #d8891a 100%);
        box-shadow: 0 0 10px rgba(255, 188, 60, 0.8);
        animation: pollenMove 5s ease-in-out infinite;
      }

      .pollen.p1 { left: 45%; top: 56%; animation-delay: 0s; }
      .pollen.p2 { left: 54%; top: 52%; animation-delay: 1s; }
      .pollen.p3 { left: 64%; top: 57%; animation-delay: 2s; }

      .pollen-dot {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(255, 185, 66, 0.9);
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        animation: dotBurst 5s ease-in-out infinite;
      }

      .pollen-dot.d1 { animation-delay: 0.4s; }
      .pollen-dot.d2 { animation-delay: 1.2s; }
      .pollen-dot.d3 { animation-delay: 2s; }

      .title {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 130px;
        color: var(--text);
        font-size: 96px;
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -3px;
        text-shadow: 0 8px 18px rgba(0,0,0,0.4);
        opacity: 0;
        animation: titleIn 20s infinite;
      }

      .title span { display: block; }

      .panel {
        position: absolute;
        left: 70px;
        right: 70px;
        bottom: 150px;
        background: rgba(7, 18, 13, 0.2);
        border: 3px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(4px);
        border-radius: 28px;
        padding: 32px 28px;
        color: var(--text);
        opacity: 0;
        animation: titleIn 20s infinite;
        animation-delay: 0.2s;
      }

      .panel .small {
        display: block;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 4px;
        color: #d7f8c9;
        margin-bottom: 8px;
      }

      .panel .big {
        display: block;
        font-size: 58px;
        font-weight: 800;
        line-height: 1.05;
      }

      .card {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: 220px;
        text-align: center;
        color: var(--text);
        font-size: 50px;
        font-weight: 900;
        opacity: 0;
        animation: titleIn 20s infinite;
      }

      .card span {
        display: block;
        margin-bottom: 12px;
      }

      .card .highlight {
        color: #ffdb59;
      }

      .fruit-row {
        position: absolute;
        left: 110px;
        right: 110px;
        bottom: 250px;
        display: flex;
        justify-content: space-between;
        opacity: 0;
        animation: titleIn 20s infinite;
        animation-delay: 0.8s;
      }

      .fruit {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        position: relative;
        box-shadow: inset -10px -10px 20px rgba(0,0,0,0.18);
      }

      .fruit.apple { background: radial-gradient(circle at 35% 30%, #ffb79e, #e6503c 65%, #9d1f1b); }
      .fruit.tomato { background: radial-gradient(circle at 35% 30%, #ff8d7d, #e12f29 60%, #8c1f1b); }
      .fruit.berry { background: radial-gradient(circle at 35% 30%, #ff6aa8, #be2d88 62%, #7e1542); }
      .fruit.pumpkin { background: radial-gradient(circle at 35% 30%, #ffd468, #d48b19 63%, #8d5510); }

      .fruit::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -14px;
        transform: translateX(-50%);
        width: 18px;
        height: 18px;
        background: green;
        border-radius: 50% 50% 0 50%;
      }

      .fruit::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        width: 66px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255,255,255,0.12);
      }

      @keyframes beeFly {
        0% { transform: translate(0, 0) scale(0.9); }
        25% { transform: translate(180px, -120px) scale(1); }
        50% { transform: translate(520px, -40px) scale(1.1); }
        75% { transform: translate(760px, -120px) scale(1); }
        100% { transform: translate(980px, 0) scale(0.9); }
      }

      @keyframes pollenMove {
        0% { transform: translate(0,0) scale(0.7); opacity: 0.2; }
        30% { transform: translate(120px, -80px) scale(1); opacity: 1; }
        60% { transform: translate(250px, -30px) scale(1.2); opacity: 1; }
        100% { transform: translate(420px, 90px) scale(0.8); opacity: 0.2; }
      }

      @keyframes dotBurst {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
        25% { opacity: 1; }
        50% { opacity: 0.8; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6) translate(120px, -80px); }
      }

      @keyframes titleIn {
        0%, 20% { opacity: 1; }
        28%, 100% { opacity: 0; }
      }

      @keyframes sway {
        0% { transform: rotate(-4deg) translateX(-50%); }
        100% { transform: rotate(4deg) translateX(-50%); }
      }
    </style>
  </head>
  <body>

      <div class="scene">

        <div class="ground"></div>
        <div class="grass"></div>
        <div class="flower">
          <span class="stem"></span>
          <span class="leaf left"></span>
          <span class="leaf right"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>

          <span class="petal"></span>
          <span class="petal"></span>

        </div>

        <div class="title">
          <span>Bees do more</span>
          <span>than make honey</span>
        </div>
      </div>

      <div class="scene">
        <div class="sun"></div>
        <div class="ground"></div>
        <div class="grass"></div>
        <div class="flower">
          <span class="stem"></span>
          <span class="leaf left"></span>
          <span class="leaf right"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>

          <span class="petal"></span>

        </div>

        <div class="bee">
          <div class="bee-wing left"></div>

          <div class="bee-body"></div>

        <div class="pollen p1"></div>

        <div class="panel">
          <span class="small">Step 1</span>

      </div>

      <div class="scene">

        <div class="grass"></div>

        <div class="flower" style="left: 28%; bottom: 210px; transform: scale(0.8) translateX(-50%);">
          <span class="stem"></span>
          <span class="leaf left"></span>
          <span class="leaf right"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="center"></span>
        </div>

        <div class="flower" style="left: 72%; bottom: 210px; transform: scale(0.8) translateX(-50%);">
          <span class="stem"></span>
          <span class="leaf left"></span>
          <span class="leaf right"></span>
          <span class="petal"></span>
          <span class="petal"></span>
          <span class="petal"></span>

        </div>

      <div class="scene">
        <div class="sun"></div>

        <div class="card">
          <span>This is</span>

        </div>
        <div class="panel">
          <span class="small">Science</span>
          <span class="big">Pollen transfer</span>
        </div>
      </div>

      <div class="scene">
        <div class="sun"></div>

        <div class="fruit-row">

  </body>
</html>
